name: Pipeline básico CI/CD

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Ejecutar test (simulado)
        run: echo "Pruebas ejecutadas exitosamente"

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Build de la aplicación
        run: echo "Aplicación construida exitosamente"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Desplegar la aplicación
        run: bash hello.sh
